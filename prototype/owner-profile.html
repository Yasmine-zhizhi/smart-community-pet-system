﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物档案与电子证 · 智慧社区宠物管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <div class="card-header">
    <div>
      <h1 style="font-size:24px;font-weight:700;margin-bottom:4px">我的宠物</h1>
      <p class="text-gray" style="font-size:14px">张先生 · 3栋2单元1502 · 共 <strong id="petCount">3</strong> 只宠物</p>
    </div>
    <div class="flex gap-12">
      <a href="owner-register-cat.html" class="btn btn-outline">+ 猫类登记</a>
      <a href="owner-register-dog.html" class="btn btn-primary">+ 犬类登记</a>
    </div>
  </div>

  <div id="petList"></div>
</div>

<script src="js/app.js"></script>
<script>
injectNavbar('owner');

function renderPetCards() {
  const list = document.getElementById('petList');
  document.getElementById('petCount').textContent = data().pets.length;
  list.innerHTML = data().pets.map(pet => `
    <div class="card" style="margin-bottom:20px;padding:28px">
      <div class="grid-2" style="gap:28px">
        <!-- 电子证 -->
        <div class="cert-card ${certCardClass(pet.certStatus)}">
          <div class="cert-header">
            <span class="cert-title">电子宠物证</span>
            <span class="cert-status">${certStatusLabel(pet.certStatus)}</span>
          </div>
          <div class="cert-pet">${pet.type==='DOG'?'🐕':'🐈'} ${pet.name}</div>
          <div class="cert-info">${pet.breed}${pet.size ? ' · '+sizeLabel(pet.size) : ''}</div>
          <div class="cert-footer">
            证号：${pet.certNo}　有效期至：${pet.certExpiry}
            ${pet.violations365 ? '<br>⚠️ 近365天违规 '+pet.violations365+' 次' : ''}
          </div>
        </div>
        <!-- 档案详情 -->
        <div>
          <h3 style="font-size:18px;font-weight:600;margin-bottom:16px">档案详情</h3>
          <div class="grid-2" style="gap:12px">
            <div>
              <div class="text-gray" style="font-size:12px">宠物类型</div>
              <div style="font-weight:500">${petTypeLabel(pet.type)}</div>
            </div>
            <div>
              <div class="text-gray" style="font-size:12px">品种</div>
              <div style="font-weight:500">${pet.breed}</div>
            </div>
            ${pet.size ? `<div>
              <div class="text-gray" style="font-size:12px">体型</div>
              <div style="font-weight:500">${sizeLabel(pet.size)}</div>
            </div>` : ''}
            <div>
              <div class="text-gray" style="font-size:12px">疫苗有效期</div>
              <div style="font-weight:500">${pet.vaccineExpiry}</div>
            </div>
          </div>
          <div style="margin-top:16px">
            <div class="text-gray" style="font-size:12px;margin-bottom:6px">电子证状态</div>
            <span class="badge ${certStatusBadge(pet.certStatus)}" style="font-size:13px;padding:5px 14px">
              ${certStatusLabel(pet.certStatus)}
            </span>
          </div>
          <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
            ${pet.certStatus === 'EXPIRED' ? '<a href="owner-renew.html" class="btn btn-warning btn-sm">🔄 立即年审</a>' : ''}
            ${pet.certStatus === 'FROZEN' ? '<span class="badge badge-danger">🔒 已冻结，请联系物业管理员</span>' : ''}
            ${pet.certStatus === 'VALID' ? '<a href="owner-reserve.html" class="btn btn-primary btn-sm">🐕 去预约遛狗区</a>' : ''}
            ${pet.certStatus === 'VALID' ? '<a href="owner-renew.html" class="btn btn-outline btn-sm">提交年审</a>' : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

renderPetCards();
</script>
</body>
</html>

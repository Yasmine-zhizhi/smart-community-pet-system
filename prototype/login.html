<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 智慧社区宠物管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🐾</div>
      <h2>欢迎回来</h2>
      <p>登录智慧社区宠物管理系统</p>
    </div>

    <form id="loginForm" onsubmit="return false">
      <div class="form-group">
        <label class="form-label">手机号码 <span class="required">*</span></label>
        <input class="form-input" type="tel" name="phone" placeholder="请输入11位手机号" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码 <span class="required">*</span></label>
        <input class="form-input" type="password" name="password" placeholder="请输入登录密码" required>
      </div>
      <div class="flex items-center justify-between mb-16">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-600)">
          <input type="checkbox" checked> 记住我
        </label>
        <a href="#" style="font-size:13px">忘记密码？</a>
      </div>
      <button class="btn btn-primary btn-lg btn-block" onclick="doLogin()">登 录</button>

      <div style="text-align:center;margin:16px 0;color:var(--gray-300)">— 或 —</div>

      <button type="button" class="btn btn-outline btn-block" onclick="location.href='owner-profile.html'">
        业主端演示登录 →
      </button>
      <button type="button" class="btn btn-outline btn-block" style="margin-top:8px" onclick="location.href='reviewer-list.html'">
        物业端演示登录 →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--gray-500)">
      还没有账号？<a href="#" style="font-weight:500">立即注册</a>
    </p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
function doLogin() {
  const phone = document.querySelector('[name=phone]').value;
  const pwd = document.querySelector('[name=password]').value;
  if (!phone || !pwd) { showToast('请填写完整登录信息', 'danger'); return; }
  showToast('登录成功，正在跳转...', 'success');
  setTimeout(() => location.href = 'owner-profile.html', 800);
}
</script>
</body>
</html>

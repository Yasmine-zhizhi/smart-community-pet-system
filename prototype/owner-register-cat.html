<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫类登记申请 · 智慧社区宠物管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-narrow">
  <h1 style="font-size:24px;font-weight:700;margin-bottom:6px">🐈 提交猫类登记申请</h1>
  <p class="text-gray" style="margin-bottom:28px">请填写猫咪信息并上传近期照片和疫苗材料。审核通过后将生成电子宠物证。</p>

  <form id="catForm" onsubmit="return false" class="card">
    <h3 class="card-title" style="margin-bottom:20px">宠物基本信息</h3>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">宠物名称 <span class="required">*</span></label>
        <input class="form-input" name="petName" placeholder="例如：咪咪" required>
      </div>
      <div class="form-group">
        <label class="form-label">品种 <span class="required">*</span></label>
        <input class="form-input" name="breed" placeholder="例如：英国短毛猫" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">疫苗有效期 <span class="required">*</span></label>
      <input class="form-input" type="date" name="vaccineExpiry" required>
    </div>

    <h3 class="card-title" style="margin:28px 0 16px">证明材料 <span class="required" style="color:var(--danger);font-size:14px">*</span></h3>
    <div class="form-group">
      <label class="form-label">猫咪近期照片 <span class="required">*</span></label>
      <div class="upload-box" id="upload-photo">
        <input type="file" id="f-photo" accept="image/*" hidden onchange="handleUpload('photo')">
        <div class="up-icon">📷</div>
        <div>点击上传或拖拽文件到此处</div>
        <div class="text-gray" style="font-size:12px">必填 · 猫咪清晰照片（正面为宜）</div>
      </div>
      <div class="form-error" id="err-photo" style="display:none">请上传猫咪近期照片</div>
    </div>
    <div class="form-group">
      <label class="form-label">疫苗材料 <span class="required">*</span></label>
      <div class="upload-box" id="upload-vaccine">
        <input type="file" id="f-vaccine" accept="image/*" hidden onchange="handleUpload('vaccine')">
        <div class="up-icon">💉</div>
        <div>点击上传或拖拽文件到此处</div>
        <div class="text-gray" style="font-size:12px">必填 · 疫苗接种证明</div>
      </div>
      <div class="form-error" id="err-vaccine" style="display:none">请上传疫苗材料</div>
    </div>
    <div class="form-group">
      <label class="form-label">补充说明（可选）</label>
      <textarea class="form-textarea" name="remark" placeholder="如有特殊情况请在此说明..."></textarea>
    </div>

    <div class="flex gap-12" style="margin-top:24px">
      <button type="button" class="btn btn-outline" style="flex:1" onclick="history.back()">取消</button>
      <button type="button" class="btn btn-primary" style="flex:2" onclick="submitCatReg()">提 交 申 请</button>
    </div>
  </form>
</div>

<style>
.upload-box {
  border: 2px dashed var(--gray-300); border-radius: var(--radius);
  padding: 32px; text-align: center; cursor: pointer;
  transition: all 0.15s; color: var(--gray-500); font-size: 14px; background: var(--gray-50);
}
.upload-box:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.upload-box.uploaded { border-color: var(--success); background: #DCFCE7; color: var(--success); }
.up-icon { font-size: 28px; margin-bottom: 8px; }
</style>

<script src="js/app.js"></script>
<script>
injectNavbar('owner');
const uploaded = { photo: false, vaccine: false };
function handleUpload(key) {
  const box = document.getElementById('upload-' + key);
  const f = document.getElementById('f-' + key);
  if (f.files && f.files.length) {
    uploaded[key] = true; box.classList.add('uploaded');
    box.innerHTML = `<div class="up-icon">✅</div><div>已上传：${f.files[0].name}</div>`;
    document.getElementById('err-' + key).style.display = 'none';
  }
}
document.getElementById('upload-photo').onclick  = () => document.getElementById('f-photo').click();
document.getElementById('upload-vaccine').onclick = () => document.getElementById('f-vaccine').click();

function submitCatReg() {
  if (!validateForm(document.getElementById('catForm'))) { showToast('请填写完整信息', 'danger'); return; }
  let ok = true;
  ['photo','vaccine'].forEach(k => {
    if (!uploaded[k]) { document.getElementById('err-'+k).style.display='block'; ok=false; }
  });
  if (!ok) { showToast('请上传所有必填材料', 'danger'); return; }

  const f = document.getElementById('catForm');
  submitRegistration('CAT', f.petName.value, f.breed.value, null);
  showModal('提交成功！', `猫类登记申请已提交<br>状态：<strong style="color:var(--warning)">📋 待审核</strong><br><br><em style="color:var(--gray-500);font-size:12px">(数据已持久化，切换到物业端可看到新申请)</em>`,
    () => location.href='owner-profile.html', '查看档案');
}
</script>
</body>
</html>
